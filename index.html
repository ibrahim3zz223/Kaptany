<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kaptany</title>
<style>
:root{--bg:#121c26;--card:#1a2733;--tx:#eef1ee;--mut:#8c9ba8;--ac:#2fa7a0;--wu:#e0a83a;--bd:#2a3a49}
body.light{--bg:#eef1ee;--card:#fff;--tx:#14202b;--mut:#5d6b78;--bd:#d3dbd8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,"Segoe UI",Tahoma,sans-serif;padding-bottom:72px}
header{display:flex;justify-content:space-between;align-items:center;max-width:720px;margin:auto;padding:14px 16px;font-size:22px;font-weight:800;letter-spacing:.5px}header span{color:var(--ac)}
main{max-width:720px;margin:auto;padding:0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac)}input{width:100%}button{cursor:pointer}
button.p{background:var(--ac);color:#fff;border:0;font-weight:700;width:100%;margin-top:8px}
.row{display:flex;gap:6px;align-items:center;margin:5px 0}.row>*{flex:1;min-width:0}.row .s{flex:0 0 auto}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--bd)}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--mut);padding:14px 2px;font-size:12px}nav button.on{color:var(--ac);font-weight:800}
.mut{color:var(--mut);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.big{font-size:24px;font-weight:800}
.wu{border-color:var(--wu)}#msg{position:fixed;top:8px;inset-inline:8px;background:#b3261e;color:#fff;padding:10px;border-radius:8px;display:none;z-index:9}
svg{width:100%;height:130px}pre{white-space:pre-wrap;font:inherit}h3{margin:14px 0 4px}
</style></head><body>
<header><div>Kap<span>tany</span></div><button onclick="document.body.classList.toggle('light')">◐</button></header>
<div id="msg"></div><main id="v"></main>
<nav id="nav"></nav>
<script>
const API='https://script.google.com/macros/s/AKfycbx0nko0uNB7t6rw6a5oYgVmnv5hPOFbcfkNmHKfsyYdiYatcvbPjh_WgdfJFYiIV4TDpA/exec';
let D={Exercises:[],Programs:[],Program:[],Sessions:[],Sets:[],Body:[],Profile:[]},page='dash',draft=null,cur=localStorage.kp||'base';
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5),today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const err=m=>{const e=$('#msg');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',7000)};
async function call(b){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b)});const j=await r.json();if(j.error)throw new Error(j.error);return j}
async function load(){try{if(API.startsWith('PASTE'))throw new Error('ضع رابط Web App في المتغير API');const r=await fetch(API);const j=await r.json();if(j.error)throw new Error(j.error);D=j;if(!D.Programs.some(p=>p.id==cur))cur=(D.Programs[0]||{id:'base'}).id}catch(e){err('تعذر تحميل البيانات: '+e.message)}render()}
const days=()=>[...new Map(D.Program.filter(p=>(p.program_id||'base')==cur).map(p=>[String(p.day),p.day_name]))];
const hist=ex=>{const m={};D.Sets.filter(s=>s.exercise==ex&&s.type=='working').forEach(s=>(m[s.date]=m[s.date]||[]).push(s));return Object.keys(m).sort().map(d=>({d,sets:m[d],top:Math.max(...m[d].map(s=>+s.weight||0)),reps:m[d].reduce((a,s)=>a+(+s.reps||0),0),vol:m[d].reduce((a,s)=>a+(+s.weight||0)*(+s.reps||0),0)}))};
function line(v){if(v.length<2)return '<p class=mut>لا توجد بيانات كافية للرسم بعد</p>';const mx=Math.max(...v),mn=Math.min(...v),r=mx-mn||1;return `<svg viewBox="0 0 300 120" preserveAspectRatio="none"><polyline points="${v.map((y,i)=>`${i*300/(v.length-1)},${110-(y-mn)/r*100}`).join(' ')}" fill="none" stroke="var(--ac)" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg><div class=mut>${mn} ← ${mx}</div>`}
const go=p=>{page=p;render()};
function render(){const N={dash:'الرئيسية',log:'تسجيل',hist:'السجل',prog:'التطور',body:'الجسم',prg:'البرامج'};$('#nav').innerHTML=Object.entries(N).map(([k,t])=>`<button class="${k==page?'on':''}" onclick="go('${k}')">${t}</button>`).join('');$('#v').innerHTML=({dash:vDash,log:vLog,hist:vHist,prog:vProg,body:vBody,prg:vPrg})[page]()}
function vDash(){const dates=[...new Set(D.Sessions.map(s=>s.date))].sort(),last=D.Sessions.slice().sort((a,b)=>a.date<b.date?-1:1).pop(),bw=D.Body.slice().sort((a,b)=>a.date<b.date?-1:1),wk=new Date(Date.now()-6*864e5).toISOString().slice(0,10),wkS=D.Sets.filter(s=>s.date>=wk&&s.type=='working');
return `<div class=grid><div class=card><div class=mut>أيام التمرين</div><div class=big>${dates.length}</div></div><div class=card><div class=mut>مجموعات العمل المسجلة</div><div class=big>${D.Sets.filter(s=>s.type=='working').length}</div></div><div class=card><div class=mut>آخر تمرين</div><div class=big>${last?esc(last.day):'—'}</div><div class=mut>${last?last.date:'لم تسجل بعد'}</div></div><div class=card><div class=mut>آخر وزن جسم</div><div class=big>${bw.length?bw[bw.length-1].weight+' kg':'—'}</div></div></div>
<div class=card><b>هذا الأسبوع (آخر 7 أيام)</b><div class=mut>${new Set(wkS.map(s=>s.date)).size} أيام • ${wkS.length} مجموعة عمل • حجم ${wkS.reduce((a,s)=>a+(+s.weight||0)*(+s.reps||0),0)} kg</div></div><div class=card><b>تطور وزن الجسم</b>${line(bw.map(b=>+b.weight))}</div>`}
const lastWork=(ex,d)=>{const h=hist(ex).filter(x=>x.d<d).pop();return h?h.sets:[]};
const sug=(L,hi)=>!L.length?'':L.every(s=>+s.reps>=hi)?' • 💡 وصلت للحد الأعلى: فكّر في رفع الوزن قليلًا إذا كان الأداء نظيفًا':' • 💡 زد التكرارات أو حسّن التحكم بنفس الوزن';
const mk=(ex,hi,p,wu,ws,d)=>{const L=lastWork(ex,d);return{name:ex,hint:(p?`الهدف: ${p} تكرار`:'تمرين إضافي')+(L.length?` • آخر مرة: ${L.map(s=>s.weight+'×'+s.reps).join('، ')}`:'')+sug(L,hi),sets:[...Array(wu).fill(0).map(()=>({type:'warmup',weight:'',reps:''})),...Array(ws).fill(0).map(()=>({type:'working',weight:'',reps:''}))]}};
function setDay(n){draft.day=n;draft.ex=D.Program.filter(p=>String(p.day)==n&&(p.program_id||'base')==cur&&p.exercise!='REST').sort((a,b)=>a.ord-b.ord).map(p=>mk(p.exercise,+String(p.reps).split('-')[1],p.reps,parseInt(p.warmup)||0,parseInt(p.working)||1,draft.date));render()}
function addEx(){const n=$('#nx').value.trim();if(!n)return;if(!D.Exercises.some(e=>e.name==n)){D.Exercises.push({name:n,custom:true});call({action:'addExercise',name:n}).catch(e=>err('لم يُحفظ اسم التمرين الجديد: '+e.message))}draft.ex.push(mk(n,99,'',0,1,draft.date));render()}
function vLog(){if(!draft)draft=JSON.parse(localStorage.kd||'null')||{id:uid(),date:today(),day:'',ex:[]};const d=draft;
return `<div class=card><div class=row><select onchange="cur=this.value;localStorage.kp=cur;draft.day='';draft.ex=[];render()">${D.Programs.map(p=>`<option value="${p.id}" ${p.id==cur?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class=row><input type=date value="${d.date}" onchange="draft.date=this.value"><select onchange="setDay(this.value)"><option value="">اختر اليوم</option>${days().map(([n,t])=>`<option value="${n}" ${n==d.day?'selected':''}>${n} - ${esc(t)}</option>`).join('')}</select></div></div>`+
(d.day&&!d.ex.length?'<p class=mut>يوم راحة، لا توجد تمارين مجدولة. يمكنك إضافة تمرين يدويًا.</p>':'')+
d.ex.map((e,i)=>`<div class=card><div class=row><b>${esc(e.name)}</b><button class=s onclick="draft.ex.splice(${i},1);render()">تخطي</button></div><div class=mut>${esc(e.hint)}</div>`+e.sets.map((s,j)=>`<div class="row ${s.type=='warmup'?'':''}"><select class=s style="${s.type=='warmup'?'border-color:var(--wu)':''}" onchange="draft.ex[${i}].sets[${j}].type=this.value;render()"><option value=working ${s.type=='working'?'selected':''}>عمل</option><option value=warmup ${s.type=='warmup'?'selected':''}>تسخين</option></select><input type=number step=any inputmode=decimal placeholder=kg value="${s.weight}" oninput="draft.ex[${i}].sets[${j}].weight=this.value"><input type=number inputmode=numeric placeholder=reps value="${s.reps}" oninput="draft.ex[${i}].sets[${j}].reps=this.value"><button class=s onclick="draft.ex[${i}].sets.splice(${j},1);render()">−</button></div>`).join('')+`<button onclick="draft.ex[${i}].sets.push({type:'working',weight:'',reps:''});render()">+ مجموعة</button></div>`).join('')+
`<div class=card><div class=row><input id=nx list=exl placeholder="ابحث أو اكتب تمرينًا جديدًا"><datalist id=exl>${D.Exercises.map(e=>`<option value="${esc(e.name)}">`).join('')}</datalist><button class=s onclick="addEx()">إضافة</button></div></div><button class=p onclick="save()">حفظ التمرين</button>`}
async function save(){const d=draft,sets=[];d.ex.forEach(e=>e.sets.forEach((s,i)=>{if(s.weight!==''||s.reps!=='')sets.push({id:uid(),session_id:d.id,date:d.date,exercise:e.name,set_no:i+1,type:s.type,weight:s.weight===''?'':+s.weight,reps:s.reps===''?'':+s.reps,note:''})}));if(!sets.length)return err('سجّل مجموعة واحدة على الأقل');
try{await call({action:'saveSession',session:{id:d.id,date:d.date,day:(days().find(x=>x[0]==d.day)||['',''])[1]||'Custom',note:'',program_id:cur},sets});localStorage.removeItem('kd');draft=null;await load();go('hist')}catch(e){localStorage.kd=JSON.stringify(d);err('فشل الحفظ. بياناتك ما زالت هنا، أعد المحاولة: '+e.message)}}
let hd=today();
function vHist(){const ss=D.Sessions.filter(s=>s.date==hd);return `<div class=card><input type=date value="${hd}" onchange="hd=this.value;render()"></div>`+(ss.length?ss.map(s=>{const g={};D.Sets.filter(x=>x.session_id==s.id).forEach(x=>(g[x.exercise]=g[x.exercise]||[]).push(x));return `<div class=card><div class=row><b>${esc(s.day)}</b><button class=s onclick="edit('${s.id}')">تعديل</button><button class=s onclick="del('${s.id}')">حذف</button></div>`+Object.entries(g).map(([n,a])=>`<div><b>${esc(n)}</b><div class=mut>${a.sort((x,y)=>x.set_no-y.set_no).map(x=>`${x.type=='warmup'?'(تسخين) ':''}${x.weight}×${x.reps}`).join('  |  ')}</div></div>`).join('')+'</div>'}).join(''):'<p class=mut>لا يوجد تمرين مسجل في هذا التاريخ.</p>')}
function edit(id){const s=D.Sessions.find(x=>x.id==id),g={};cur=s.program_id||'base';D.Sets.filter(x=>x.session_id==id).sort((a,b)=>a.set_no-b.set_no).forEach(x=>(g[x.exercise]=g[x.exercise]||[]).push({type:x.type,weight:x.weight,reps:x.reps}));draft={id,date:s.date,day:(days().find(x=>x[1]==s.day)||[''])[0],ex:Object.entries(g).map(([name,sets])=>({name,hint:'',sets}))};go('log')}
async function del(id){if(!confirm('حذف هذا التمرين نهائيًا؟'))return;try{await call({action:'deleteSession',id});await load()}catch(e){err('فشل الحذف: '+e.message)}}
let pe='';
function vProg(){const names=[...new Set(D.Sets.map(s=>s.exercise))].sort();pe=pe||names[0]||'';const h=hist(pe),l=h[h.length-1],p=h[h.length-2];
return `<div class=card><select onchange="pe=this.value;render()">${names.map(n=>`<option ${n==pe?'selected':''}>${esc(n)}</option>`).join('')}</select></div>`+(!h.length?'<p class=mut>سجّل تمرينًا أولًا لتظهر الإحصائيات.</p>':`<div class=grid><div class=card><div class=mut>آخر وزن</div><div class=big>${l.top}</div></div><div class=card><div class=mut>أعلى وزن</div><div class=big>${Math.max(...h.map(x=>x.top))}</div></div><div class=card><div class=mut>حجم آخر جلسة</div><div class=big>${l.vol}</div></div><div class=card><div class=mut>مقارنة بالسابقة</div><div class=big>${p?(l.vol>=p.vol?'▲ ':'▼ ')+(l.vol-p.vol):'—'}</div><div class=mut>${p?`تكرارات ${p.reps} ← ${l.reps}`:''}</div></div></div><div class=card><b>أعلى وزن لكل جلسة</b>${line(h.map(x=>x.top))}</div><div class=card><b>إجمالي التكرارات</b>${line(h.map(x=>x.reps))}</div><div class=card><b>حجم التدريب (مجموعات العمل فقط)</b>${line(h.map(x=>x.vol))}</div>`)}
const pf=k=>(D.Profile.find(p=>p.key==k)||{}).value;
function calc(){const sx=$('#sx').value,a=+$('#ag').value,h=+$('#ht').value,w=+$('#wt').value,act=+$('#ac').value;if(!a||!h||!w)return err('أدخل العمر والطول والوزن');const bmr=10*w+6.25*h-5*a+(sx=='m'?5:-161),t=bmr*act;$('#res').innerHTML=`BMR: <b>${Math.round(bmr)}</b><br>TDEE: <b>${Math.round(t)}</b><br>محافظة: ${Math.round(t)} • خسارة: ${Math.round(t-500)} • زيادة: ${Math.round(t+300)} سعرة<div class=mut>تقديرات تقريبية (Mifflin-St Jeor)؛ الخسارة −500 والزيادة +300 قيم افتراضية.</div>`;call({action:'saveProfile',profile:{sex:sx,age:a,height:h,activity:act}}).catch(()=>{})}
async function addW(){const w=+$('#bw').value;if(!w)return err('أدخل الوزن');try{await call({action:'addBody',date:$('#bd').value,weight:w});await load()}catch(e){err('فشل حفظ الوزن: '+e.message)}}
function vBody(){const bw=D.Body.slice().sort((a,b)=>a.date<b.date?-1:1),o=(v,t,c)=>`<option value="${v}" ${c==v?'selected':''}>${t}</option>`;
return `<div class=card><div class=row><select id=sx>${o('m','ذكر',pf('sex'))}${o('f','أنثى',pf('sex'))}</select><input id=ag type=number placeholder="العمر" value="${pf('age')||''}"></div><div class=row><input id=ht type=number placeholder="الطول سم" value="${pf('height')||''}"><input id=wt type=number step=any placeholder="الوزن كجم" value="${bw.length?bw[bw.length-1].weight:''}"></div><select id=ac>${[['1.2','خامل'],['1.375','خفيف (1-3 أيام)'],['1.55','متوسط (3-5 أيام)'],['1.725','عالٍ (6-7 أيام)'],['1.9','عالٍ جدًا']].map(([v,t])=>o(v,t,pf('activity'))).join('')}</select><button class=p onclick="calc()">احسب</button><div id=res style="margin-top:8px"></div></div>
<div class=card><b>تسجيل وزن الجسم</b><div class=row><input id=bd type=date value="${today()}"><input id=bw type=number step=any placeholder=kg><button class=s onclick="addW()">حفظ</button></div>${line(bw.map(b=>+b.weight))}</div>`}
const tpl='# Upper A\nSmith High Incline Press | 1-2 | 2 | 6-8\n\n# Rest\n\n# Lower A\nHack Squat | 1-3 | 1 | 5-8';
function vPrg(){return `<div class=card><b>برامجك</b>${D.Programs.map(p=>`<div class=row><span>${esc(p.name)}</span><button class=s ${p.id==cur?'disabled':''} onclick="cur='${p.id}';localStorage.kp=cur;go('log')">${p.id==cur?'الحالي':'استخدم'}</button></div>`).join('')}</div><div class=card><b>إضافة برنامج جديد</b><p class=mut>اكتب اسم اليوم بعد # ثم تمارينه، سطر لكل تمرين: الاسم | تسخين | عمل | تكرارات. يوم الراحة: # Rest بدون تمارين. البرامج الحالية لا تتغير.</p><input id=pn placeholder="اسم البرنامج"><textarea id=pt rows=12 style="width:100%;margin-top:6px" placeholder="${esc(tpl)}"></textarea><button class=p onclick="saveProg()">حفظ البرنامج</button></div>`}
async function saveProg(){const name=$('#pn').value.trim(),rows=[],bad=[];let d=0,dn='';$('#pt').value.split('\n').forEach(l=>{l=l.trim();if(!l)return;if(l[0]=='#'){d++;dn=l.slice(1).trim();if(/^rest/i.test(dn))rows.push({day:d,day_name:dn,ord:1,exercise:'REST'})}else{const a=l.split('|').map(x=>x.trim());if(a.length==4&&d&&a[0])rows.push({day:d,day_name:dn,ord:rows.filter(r=>r.day==d).length+1,exercise:a[0],warmup:a[1],working:a[2],reps:a[3]});else bad.push(l)}});
if(bad.length)return err('سطر غير صالح: '+bad[0]);if(!name||!rows.length)return err('اكتب اسم البرنامج وتمارينه');const id='p'+uid();try{await call({action:'saveProgram',program:{id,name},rows});cur=id;localStorage.kp=id;await load();go('log')}catch(e){err('فشل حفظ البرنامج: '+e.message)}}
load();
</script></body></html>
